/* =====================
   LIVE FILTERING
   ===================== */
const inputs = document.querySelectorAll("input");
inputs.forEach(i => i.addEventListener("input", filterWords));

function filterWords() {
    const green = [...document.querySelectorAll(".green")].map(i => i.value.toLowerCase());
    const yellow = [...document.querySelectorAll(".yellow")].map(i => i.value.toLowerCase());
    const gray = document.getElementById("grayInput").value.toLowerCase();

    let results = WORDS.filter(word => {
        // Green logic
        for (let i = 0; i < 5; i++) {
            if (green[i] && word[i] !== green[i]) return false;
        }

        // Yellow logic
        for (let i = 0; i < 5; i++) {
            if (yellow[i]) {
                if (!word.includes(yellow[i])) return false;
                if (word[i] === yellow[i]) return false;
            }
        }

        // Gray logic
        for (const letter of gray) {
            if (word.includes(letter)) return false;
        }

        return true;
    });

    renderResults(results, green, yellow);
}

function renderResults(words, green, yellow) {
    const container = document.getElementById("results");
    container.innerHTML = "";

    words.forEach(word => {
        const span = document.createElement("span");

        [...word].forEach((letter, i) => {
            let cls = "";
            if (green[i] === letter) cls = "match-green";
            else if (yellow.includes(letter)) cls = "match-yellow";

            span.innerHTML += `<span class="${cls}">${letter}</span>`;
        });

        container.appendChild(span);
    });

    document.getElementById("count").textContent =
        `Resultados: ${words.length}`;
}

// Initial run
filterWords();
</script>
